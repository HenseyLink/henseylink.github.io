<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://yookassa.ru https://yoomoney.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https://yastatic.net; connect-src 'self' https://pay.melodico.online https://yookassa.ru https://yoomoney.ru https://yastatic.net; form-action https:; frame-src https://yookassa.ru https://yoomoney.ru; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
    <title>Проверка оплаты - melodico</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'%3E%3Cpath d='M0 336c0 79.5 64.5 144 144 144H512c70.7 0 128-57.3 128-128c0-61.9-44-113.6-102.4-125.4c4.1-10.7 6.4-22.4 6.4-34.6c0-53-43-96-96-96c-19.7 0-38.1 6-53.3 16.2C363.2 41.9 311.4 0 256 0C167.6 0 96 71.6 96 160c0 2.7 .1 5.4 .2 8.1C40.2 196.5 0 264 0 336z' fill='white'/%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="stylesheet" href="custom.css?v=20260423-2215">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Unbounded:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Unbounded', 'bold'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#ffffff',
                            dark: '#e5e5e5',
                        },
                        dark: {
                            900: '#000000',
                            800: '#121212',
                            700: '#262626',
                        }
                    }
                }
            }
        }
    </script>
    <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="site-shell antialiased min-h-screen flex items-center justify-center p-4 bg-gray-50 dark:bg-dark-900 transition-colors duration-300">

    <div class="liquid-page w-full flex items-center justify-center">
        <div class="liquid-card liquid-center-card text-center">
        <div id="status-container" class="relative z-10 liquid-status-loading">
            <div class="liquid-icon-badge glass-chip mx-auto mb-6">
                <i class="fa-solid fa-rotate text-3xl text-black/60 dark:text-white/60 spin-slow"></i>
            </div>

            <h1 id="status-title" class="text-2xl font-bold text-black dark:text-white mb-4">Проверяем оплату...</h1>

            <div id="success-content" class="hidden">
                <p class="liquid-muted mb-4 leading-relaxed">Оплата подтверждена! Ваш код:</p>
                <h2 id="token-display" class="text-3xl font-bold text-green-500 mb-6"></h2>
                <a id="bot-link" href="#" class="glass-button w-full py-4 rounded-full font-bold text-lg inline-flex items-center justify-center mb-4 bg-[#229ED9]/90 border border-white/30 text-white">
                    <i class="fa-brands fa-telegram mr-2"></i>
                    Активировать в Telegram
                </a>
            </div>

            <div id="error-content" class="hidden">
                <p class="text-red-500 mb-6 leading-relaxed">Оплата еще не подтверждена или была отменена.</p>
                <button type="button" id="retry-payment" class="glass-button glass-button-primary w-full py-4 font-bold text-lg inline-flex items-center justify-center mb-4">
                    Проверить еще раз
                </button>
                <a href="index.html" class="glass-button glass-button-secondary w-full py-4 font-medium inline-flex items-center justify-center">
                    Вернуться на главную
                </a>
            </div>
        </div>
        </div>
    </div>

    <script>
        async function verifyPayment() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                showError();
                return;
            }

            try {
                const response = await fetch(`https://pay.melodico.online/check_status?token=${encodeURIComponent(token)}`);
                if (!response.ok) {
                    showError();
                    return;
                }
                const data = await response.json();

                if (data.status === 'paid') {
                    showSuccess(token);
                } else {
                    showError();
                }
            } catch (e) {
                console.error('Ошибка проверки:', e);
                showError();
            }
        }

        function showSuccess(token) {
            const botUsername = 'melodicowbot';
            const container = document.getElementById('status-container');
            container.classList.remove('liquid-status-loading', 'liquid-status-error');
            container.classList.add('liquid-status-success');
            document.getElementById('status-title').innerText = 'Оплата прошла успешно!';
            document.getElementById('error-content').classList.add('hidden');
            document.getElementById('success-content').classList.remove('hidden');
            document.getElementById('token-display').innerText = token;
            document.getElementById('bot-link').href = `https://t.me/${botUsername}?start=${encodeURIComponent(token)}`;
        }

        function showError() {
            const container = document.getElementById('status-container');
            container.classList.remove('liquid-status-loading', 'liquid-status-success');
            container.classList.add('liquid-status-error');
            document.getElementById('status-title').innerText = 'Упс! Что-то пошло не так';
            document.getElementById('success-content').classList.add('hidden');
            document.getElementById('error-content').classList.remove('hidden');
        }

        verifyPayment();

        const retryButton = document.getElementById('retry-payment');
        if (retryButton) {
            retryButton.addEventListener('click', verifyPayment);
        }
    </script>

</body>
</html>
